services:
  - type: web
    name: chronicle-engine
    runtime: node
    plan: free # 100% Free Tier on Render (using external Neon PostgreSQL for persistence)
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard to your Neon PostgreSQL connection string (postgresql://...)
      - key: ADMIN_API_KEY
        generateValue: true # Render automatically generates a cryptographically secure random key
      - key: CHRONICLE_PUBLIC_URL
        sync: false # Set in Render Dashboard to your service URL: https://<service-name>.onrender.com
