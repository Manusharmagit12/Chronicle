services:
  - type: web
    name: chronicle-engine
    runtime: node
    plan: starter # Render Starter plan or above is required for Persistent Disks
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: chronicle-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: CHRONICLE_DATA_DIR
        value: /var/data
      - key: ADMIN_API_KEY
        generateValue: true # Render automatically generates a cryptographically secure random key
      - key: CHRONICLE_PUBLIC_URL
        sync: false # Set in Render Dashboard to your service URL: https://<service-name>.onrender.com
